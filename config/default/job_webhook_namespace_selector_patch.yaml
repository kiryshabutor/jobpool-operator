# The Job webhook uses failurePolicy: Fail. To keep an operator outage from blocking
# Jobs cluster-wide, the API server calls it only for namespaces the controller has
# labelled (namespaces with a JobPool). controller-gen markers cannot set
# namespaceSelector, hence this patch.
# The "test" op makes the build fail if webhooks[0] is not the Job webhook.
- op: test
  path: /webhooks/0/name
  value: mjob.kiribu.dev
- op: add
  path: /webhooks/0/namespaceSelector
  value:
    matchLabels:
      jobpool.kiribu.dev/enabled: "true"
