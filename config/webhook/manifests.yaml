---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-batch-v1-job
  failurePolicy: Fail
  name: mjob.kiribu.dev
  rules:
  - apiGroups:
    - batch
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - jobs
  sideEffects: None
  timeoutSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-scheduling-kiribu-dev-v1alpha1-jobpool
  failurePolicy: Fail
  name: vjobpool.kiribu.dev
  rules:
  - apiGroups:
    - scheduling.kiribu.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - jobpools
  sideEffects: None
  timeoutSeconds: 5
