---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools/finalizers
  verbs:
  - update
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools/status
  verbs:
  - get
  - patch
  - update
