---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools/finalizers
  verbs:
  - update
- apiGroups:
  - scheduling.kiribu.dev
  resources:
  - jobpools/status
  verbs:
  - get
  - patch
  - update
