apiVersion: scheduling.kiribu.dev/v1alpha1
kind: JobPool
metadata:
  labels:
    app.kubernetes.io/name: jobpool-operator
    app.kubernetes.io/managed-by: kustomize
  # Any name: one JobPool per namespace, the webhook rejects a second one.
  name: limit
spec:
  # At most 2 Jobs run at the same time in this namespace, the rest wait in a FIFO queue.
  maxConcurrentJobs: 2
